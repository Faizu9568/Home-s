<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Provider Login | HomeServe</title>

    <link rel="stylesheet" href="../css/loginstyle.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            HomeServe
        </div>

        <ul class="nav-links">

            <li>
                <a href="home.html">Home</a>
            </li>

            <li>
                <a href="service.html">Services</a>
            </li>

            <li>
                <a href="home.html#about">About</a>
            </li>

            <li>
                <a href="home.html#contact">Contact</a>
            </li>

        </ul>

    </nav>


    <section class="login-section">

        <div class="login-box">

            <h1>
                Provider Login 🔧
            </h1>

            <p class="login-description">
                Login to manage your service bookings.
            </p>


            <form
                action="../php/login_process.php"
                method="POST"
            >

                <input
                    type="hidden"
                    name="login_role"
                    value="provider"
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your provider email"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    Provider Login
                </button>

            </form>


            <p class="register-text">

                Don't have a provider account?

                <a href="register.html">
                    Create account
                </a>

            </p>


            <p class="register-text">

                Are you a customer?

                <a href="login.html">
                    Customer Login
                </a>

            </p>


            <p class="register-text">

                <a href="home.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </section>


    <footer>

        <h3>
            HomeServe
        </h3>

        <p>
            Your trusted home service provider.
        </p>

        <p>
            © 2026 HomeServe. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
